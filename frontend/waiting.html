<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting for Match - My Val</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="assets/logo.png">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="dashboard.html" class="logo">
            <img src="assets/logo.png" alt="My Val" class="logo-img">
        </a>
        <div class="nav-links">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <button class="btn btn-secondary" id="logout-btn">Logout</button>
        </div>
    </nav>

    <!-- Waiting Section -->
    <section class="waiting-section">
        <div class="waiting-container">
            <img src="assets/logo.png" alt="My Val" class="waiting-logo pulse">

            <h1 class="waiting-title">We're Getting Your Match 💗</h1>
            <p class="waiting-message" id="match-message">
                Thank you for your patience.<br>
                Your match will be revealed soon!
            </p>

            <div class="countdown" id="countdown">
                <div class="countdown-item">
                    <span class="countdown-value" id="days">--</span>
                    <span class="countdown-label">Days</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-value" id="hours">--</span>
                    <span class="countdown-label">Hours</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-value" id="minutes">--</span>
                    <span class="countdown-label">Minutes</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-value" id="seconds">--</span>
                    <span class="countdown-label">Seconds</span>
                </div>
            </div>

            <p class="text-muted mb-xl">Match reveal on <strong class="text-pink">February 10th, 2026</strong></p>

            <div class="waiting-note">
                💡 Your match's phone number will be revealed on the reveal date. No chatting required!
            </div>

            <a href="dashboard.html" class="btn btn-secondary mt-xl">
                ← Back to Dashboard
            </a>
        </div>
    </section>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/waiting.js"></script>
</body>

</html>
